<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조선 국정 회의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.play{display:grid; grid-template-columns:1fr 340px; gap:16px; align-items:start}
.side{display:flex; flex-direction:column; gap:14px}
.mykd{max-width:520px}
@media (max-width:980px){ .play{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top"><div class="top-in"><div><b>朝鮮 國政 會議</b> <span class="sub">조선 국정 회의 · 모둠 화면</span></div><div class="row"><span class="sub" id="who"></span><span class="conn" id="conn"><i></i> 대기</span></div></div></header>
<main id="app"></main>
<script src="config.js"></script>
<script src="scenarios.js"></script>
<script src="core.js"></script>
<script src="art.js"></script>
<script src="common.js"></script>
<script>
const KEY='joseon-team-v2', MIN_WHY=30, MIN_REF=40;
const BUD_COLORS={df:'#24384c', lv:'#2f6b5e', cu:'#a97c25'};
const $app=document.getElementById('app');
let L=load(), room=null, ver=0, shown='', editing=false, timer=null;
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(L)); }catch(e){} }
function me(){ return room && room.teams.find(t=>t.id===L.teamId); }
function v(id){ const e=document.getElementById(id); return e?e.value:''; }
function fail(m){ const e=document.getElementById('err'); if(e){ e.textContent=m; e.scrollIntoView({block:'center'}); } }

/* ---------- 실시간 갱신 ---------- */
function poll(){
  clearTimeout(timer);
  if(!L.code||!L.teamId) return;
  API.state(L.code, ver, L.teamId).then(j=>{
    setConn(true);
    if(!j.ok){ if(/찾을 수 없/.test(j.error||'')){ L={}; save(); room=null; render(); } return; }
    if(j.same) return;
    room=j.room; ver=room.ver;
    if(!me()){ L.teamId=null; save(); room=null; render(); return; }
    render();
  }).catch(()=>setConn(false)).finally(()=>{ timer=setTimeout(poll, 2500); });
}
function key(){ const m=me(); return [room.phase, room.turn, m.submitted?1:0, m.final?1:0, editing?1:0].join(':'); }
function render(){
  if(!room){ shown=''; return vJoin(); }
  const s=scenOf(room), m=me();
  document.getElementById('who').textContent = m.name+' 모둠 · '+s.king+' 시대 · 방 '+room.code;
  const k=key();
  if(k===shown){ liveUpdate(); return; }
  shown=k;
  ({lobby:vLobby, deciding:vDecide, revealed:vReveal, ended:vEnd})[room.phase]();
  window.scrollTo(0,0);
}
function liveUpdate(){
  const g=document.getElementById('live'); if(g) g.innerHTML=othersHTML();
  const lb=document.getElementById('lb'); if(lb) lb.innerHTML=leaderboardHTML(room, L.teamId);
  const st=document.getElementById('subst'); if(st) st.innerHTML=subStatus();
}
function othersHTML(){ return '<div class="teams">'+room.teams.map(t=>teamCard(room,t,{me:t.id===L.teamId})).join('')+'</div>'; }
function subStatus(){ const n=room.teams.filter(t=>t.submitted).length; return `<span class="pill ${n===room.teams.length?'good':'navy'}">어명 제출 ${n}/${room.teams.length} 모둠</span>`; }

/* ---------- 참가 ---------- */
function vJoin(){
  document.getElementById('who').textContent='';
  const q=new URLSearchParams(location.search).get('room')||'';
  $app.innerHTML=`<div class="stack">
    <div class="banner">${bannerSVG(220)}<div class="over"><h1>朝鮮 國政 會議</h1><p>모둠이 한 나라를 맡아 조선의 위기를 해결합니다</p></div></div>
    ${!serverUrl()?'<div class="note crisis">아직 서버 주소가 설정되지 않았습니다. 선생님께 알려 주세요.</div>':''}
    <form class="card stack" id="join" style="max-width:560px; margin:0 auto; width:100%" novalidate>
      <h2 style="font-size:22px">어전 회의에 참가하기</h2>
      <label class="f" for="code">방 코드 <span class="hint">교실 화면에 보이는 네 글자</span><input type="text" id="code" value="${esc(L.code||q)}" maxlength="4" autocomplete="off" style="font-size:28px; letter-spacing:.3em; text-transform:uppercase; font-family:var(--display); font-weight:800"></label>
      <label class="f" for="team">모둠 이름<input type="text" id="team" value="${esc(L.teamName||'')}" maxlength="20" placeholder="예: 집현전" autocomplete="off"></label>
      <label class="f" for="members">모둠원 <span class="hint">번호와 이름, 쉼표로 구분</span><input type="text" id="members" value="${esc(L.members||'')}" placeholder="예: 3 김민준, 7 이서연, 12 박지호" autocomplete="off"></label>
      <div class="err" id="err"></div>
      <button class="btn primary big" type="submit">입궐하기</button>
      <p class="hint" style="margin:0">같은 모둠 이름으로 다시 들어오면 이어서 할 수 있습니다.</p>
    </form></div>`;
}

/* ---------- 대기실 ---------- */
function vLobby(){
  const s=scenOf(room), m=me();
  $app.innerHTML=`<div class="stack">
    <div class="banner">${bannerSVG(170)}<div class="over"><div class="eyebrow" style="color:#f3d9a0">재위 ${s.reign}</div><h1>${s.king} · ${esc(s.title)}</h1></div></div>
    <div class="play"><div class="stack">
      <div class="card stack"><div class="row between"><h2 style="font-size:20px">즉위 당시 나라의 형편</h2><span class="pill navy">선생님이 첫 사건을 열 때까지 기다리세요</span></div>
        <p style="margin:0; font-size:16px; line-height:1.8">${esc(s.lead)}</p>
        <div class="mykd">${kingdomSVG(m.st)}</div></div>
      <div class="card stack"><h3 style="font-size:18px">우리 모둠의 국정 방향</h3>
        <label class="f" for="goal">가장 시급한 문제는 무엇이며, 어떤 지표를 먼저 살릴 것인가요?<textarea id="goal">${esc(L.goalDraft!=null?L.goalDraft:m.goal)}</textarea></label>
        <div class="row"><button class="btn jade" data-act="goal">국정 방향 저장</button><span class="small" id="gs">${m.goal?'저장됨':''}</span></div></div>
    </div>
    <div class="side"><div class="card">${gaugesHTML(m.st)}</div></div></div>
    <div class="card stack"><h3 style="font-size:18px">입궐한 모둠</h3><div id="live">${othersHTML()}</div></div></div>`;
}

/* ---------- 결정 ---------- */
function draft(){
  const m=me();
  if(!L.draft || L.draft.turn!==room.turn || L.draft.code!==room.code){
    const last=m.log[m.log.length-1];
    L.draft={code:room.code, turn:room.turn, pick:null, why:'', tax:last?last.tax:3, bud:last?Object.assign({},last.bud):{df:34,lv:33,cu:33}};
  }
  return L.draft;
}
function vDecide(){
  const s=scenOf(room), m=me(), turn=s.turns[room.turn], d=draft();
  const head=`<div class="row between" style="margin-bottom:12px"><div class="steps">${s.turns.map((_,i)=>`<i class="${i<room.turn?'d':i===room.turn?'n':''}"></i>`).join('')}</div><span id="subst">${subStatus()}</span></div>
    <div class="card event">${eventArt(turn.art)}<div><div class="yr">${turn.year}년 · 사건 ${room.turn+1}/${s.turns.length}</div><h2>${esc(turn.title)}</h2><p>${esc(turn.text)}</p>${turn.war?'<p style="margin-top:8px"><span class="pill bad">전쟁 · 쌓아 둔 국방력이 피해를 좌우합니다</span></p>':''}</div></div>`;
  if(m.submitted && !editing){
    const sub=room.mySub, ch=sub&&turn.choices.find(c=>c.id===sub.choice);
    $app.innerHTML=`${head}<div class="play" style="margin-top:16px"><div class="stack">
      <div class="card stack" style="text-align:center; align-items:center"><span class="stamp pop" style="position:static; transform:rotate(-6deg); font-size:26px; padding:6px 18px">裁可</span>
        <h2 style="font-size:22px">어명을 올렸습니다</h2>
        ${ch?`<p style="margin:0">선택: <b>${esc(ch.label)}</b> · 세금 ${TAX_TXT[sub.gov.tax]}</p><p class="small muted" style="margin:0; max-width:60ch">${esc(sub.why)}</p>`:''}
        <p class="small muted" style="margin:0">선생님이 결과를 공개할 때까지 고칠 수 있습니다.</p>
        <button class="btn" data-act="edit">어명 고치기</button></div>
      <div class="card"><h3 style="font-size:17px; margin-bottom:10px">다른 나라 현황</h3><div id="live">${othersHTML()}</div></div></div>
      <div class="side"><div class="card">${gaugesHTML(m.st)}</div></div></div>`;
    return;
  }
  $app.innerHTML=`${head}
  <div class="choices" style="margin-top:14px">${turn.choices.map((c,i)=>`<button type="button" class="ch" data-pick="${c.id}" aria-pressed="${d.pick===c.id}"><span class="lt">${'甲乙丙'[i]}</span><b>${esc(c.label)}</b><span>${esc(c.desc)}</span><div class="tags">${tagsOf(c.eff)}</div></button>`).join('')}</div>
  <p class="hint">▲▼는 즉각적인 효과의 방향만 보여 줍니다. 크기와 몇 해 뒤의 효과는 숨겨져 있습니다.</p>
  <div class="play"><div class="stack">
    <form class="card stack" id="act" novalidate>
      <label class="f" for="why">결정 근거 <span class="hint">왜 이 대책을 골랐는지, 무엇을 감수하는지 모둠 의견을 쓰세요. (${MIN_WHY}자 이상)</span><textarea id="why">${esc(d.why)}</textarea><span class="hint" id="cnt">${d.why.trim().length}자</span></label>
      <div class="err" id="err"></div>
      <button class="btn primary big" type="submit">어명을 올린다</button></form>
    <div class="card"><h3 style="font-size:17px; margin-bottom:10px">다른 나라 현황</h3><div id="live">${othersHTML()}</div></div></div>
  <div class="side">
    <div class="card"><h3 style="font-size:16px; margin-bottom:8px">우리 나라</h3>${kingdomSVG(m.st)}<div style="margin-top:10px" id="gg">${gaugesHTML(m.st, govEffect(d,m.st))}</div>
      <p class="hint" style="margin:8px 0 0">빗금은 세금·예산으로 이번 해에 변할 양입니다.</p></div>
    <div class="card stack"><h3 style="font-size:16px">국정 운영</h3>
      <div class="sl"><div class="h"><b><label for="tax">세금</label></b><span id="tx">${TAX_TXT[d.tax]}</span></div><input type="range" id="tax" min="1" max="5" step="1" value="${d.tax}"><div class="ticks"><span>가볍게(민심▲)</span><span>무겁게(국고▲)</span></div></div>
      <div class="sl"><div class="h"><b>예산 배분</b></div><div class="budget" id="bb"></div></div>
      ${['df','lv','cu'].map(k=>`<div class="sl"><div class="h"><label for="b-${k}">${STATS[k].name}</label><span id="bp-${k}"></span></div><input type="range" id="b-${k}" data-bud="${k}" min="0" max="100" step="5" value="${d.bud[k]}"></div>`).join('')}
    </div></div></div>`;
  updGov();
}
function updGov(){
  const d=L.draft, m=me(), b=d.bud, tot=(b.df+b.lv+b.cu)||1;
  const tx=document.getElementById('tx'); if(tx) tx.textContent=TAX_TXT[d.tax];
  ['df','lv','cu'].forEach(k=>{ const e=document.getElementById('bp-'+k); if(e) e.textContent=Math.round(b[k]/tot*100)+'%'; });
  const bb=document.getElementById('bb'); if(bb) bb.innerHTML=['df','lv','cu'].map(k=>`<i style="width:${b[k]/tot*100}%;background:${BUD_COLORS[k]}"></i>`).join('');
  const gg=document.getElementById('gg'); if(gg) gg.innerHTML=gaugesHTML(m.st, govEffect(d,m.st));
}

/* ---------- 결과 공개 ---------- */
function vReveal(){
  const s=scenOf(room), m=me(), turn=s.turns[room.turn], l=m.log.find(x=>x.t===room.turn);
  const r=rankOf(room,m.id);
  $app.innerHTML=`<div class="stack">
    <div class="card stack"><div class="row between"><div class="eyebrow">${turn.year}년 실록</div><span class="pill navy">현재 ${r}위 · ${m.score}점</span></div>
      ${l?`<div class="rec">${turn.year}년, ${s.king}께서 「${esc(turn.title)}」에 대하여 <b>${esc(l.label)}</b>을(를) 명하시고, 세금은 ${TAX_TXT[l.tax]} 걷게 하셨다.</div>
      <div class="deltas">${SKEYS.map(k=>`<div class="dl"><div class="k">${STATS[k].name}</div><div class="n ${l.delta[k]>0?'up':l.delta[k]<0?'dn':'z'}">${sg(l.delta[k])}</div><div class="small muted num">${Math.round(m.st[k])}</div></div>`).join('')}</div>
      ${l.notes.map(n=>`<div class="note ${n.type}">${n.type==='later'?'뒤늦게 나타난 효과: ':''}${esc(n.text)}</div>`).join('')}
      ${l.ach?`<div><span class="ach pop">業 업적 달성 · ${esc(l.ach)}</span></div>`:''}`:'<p class="muted">이번 사건에는 참여하지 않았습니다.</p>'}
    </div>
    <div class="card stack"><h3 style="font-size:18px">모둠들의 선택과 실제 역사</h3>${distHTML(room, room.turn, m.id)}
      <div class="real"><b>실제 역사에서는</b> ${esc(turn.real.text)}</div></div>
    <div class="play"><div class="card"><h3 style="font-size:17px; margin-bottom:10px">각 나라의 모습</h3><div id="live">${othersHTML()}</div></div>
      <div class="side"><div class="card"><h3 style="font-size:16px; margin-bottom:10px">순위</h3><div id="lb">${leaderboardHTML(room,m.id)}</div></div>
        <div class="card"><p class="small muted" style="margin:0">${room.turn+1>=s.turns.length?'선생님이 최종 결과를 열면 치세가 마무리됩니다.':'선생님이 다음 사건을 열 때까지 결과를 함께 살펴보세요.'}</p></div></div></div></div>`;
}

/* ---------- 최종 ---------- */
function reportText(){
  const s=scenOf(room), m=me(), Lr=[];
  Lr.push('[조선 국정 회의 보고서]'); Lr.push('방: '+room.code+' / 모둠: '+m.name+' / 모둠원: '+m.members);
  Lr.push('시대: '+s.king+' ('+s.reign+') '+s.title); Lr.push('점수: '+m.score+'점 ('+rankOf(room,m.id)+'위/'+room.teams.length+'모둠) / 실제 역사와 일치: '+m.matches+'/'+m.log.length);
  Lr.push('최종 지표: '+SKEYS.map(k=>STATS[k].name+' '+Math.round(m.st[k])).join(', '));
  Lr.push('업적: '+(m.ach.join(', ')||'없음')+' / 위기: '+(m.crises.map(c=>c.year+' '+c.name).join(', ')||'없음'));
  if(m.ending) Lr.push('결말: '+m.ending.title+' - '+m.ending.text);
  Lr.push(''); Lr.push('■ 국정 방향'); Lr.push(m.goal||'(작성하지 않음)'); Lr.push(''); Lr.push('■ 사건별 결정');
  m.log.forEach(l=>{ const t=s.turns[l.t], rc=t.choices.find(c=>c.id===t.real.pick);
    Lr.push(l.year+'년 '+t.title+' | 선택: '+l.label+' | 세금: '+TAX_TXT[l.tax]+' | 실제: '+rc.label); Lr.push('   근거: '+l.why); });
  Lr.push(''); Lr.push('■ 성찰'); Lr.push('1) '+(L.ref&&L.ref.a||'')); Lr.push('2) '+(L.ref&&L.ref.b||'')); Lr.push('3) '+(L.ref&&L.ref.c||''));
  return Lr.join('\n');
}
function vEnd(){
  const s=scenOf(room), m=me(), r=rankOf(room,m.id); L.ref=L.ref||{a:'',b:'',c:''};
  const cmp=m.log.map(l=>{ const t=s.turns[l.t], rc=t.choices.find(c=>c.id===t.real.pick); return `<tr><td class="num">${l.year}</td><td>${esc(t.title)}</td><td><b>${esc(l.label)}</b></td><td>${esc(rc.label)}</td><td>${l.real?'<span class="pill good">같음</span>':'<span class="pill">다름</span>'}</td></tr>`; }).join('');
  $app.innerHTML=`<div class="stack">
    <div class="banner">${bannerSVG(150)}<div class="over"><div class="eyebrow" style="color:#f3d9a0">${s.king} 치세 종료</div><h1>${esc(m.name)} 모둠 · ${r}위 · ${m.score}점</h1></div></div>
    <div class="play"><div class="stack">
      <div class="card stack">${m.ending?`<div class="note ${m.ending.bonus<0?'crisis':''}"><b>${esc(m.ending.title)}</b> · ${esc(m.ending.text)}</div>`:''}
        ${m.lateNotes.length?`<div class="note">후대에 나타난 효과: ${m.lateNotes.map(esc).join(' ')}</div>`:''}
        <div class="mykd">${kingdomSVG(m.st)}</div>
        <div class="row"><b>업적</b> ${m.ach.length?m.ach.map(a=>`<span class="ach" style="font-size:14px;padding:3px 10px">${esc(a)}</span>`).join(''):'<span class="muted small">없음</span>'}</div>
        <h3 style="font-size:16px">우리 선택과 실제 역사 (${m.matches}/${m.log.length} 일치)</h3>
        <div class="tw"><table class="t"><thead><tr><th>연도</th><th>사건</th><th>우리 모둠</th><th>실제 왕</th><th></th></tr></thead><tbody>${cmp}</tbody></table></div></div>
      ${m.final?`<div class="card stack"><h3 style="font-size:18px">제출 완료</h3><p class="small muted" style="margin:0">성찰이 선생님께 제출되었습니다. 보고서를 복사해 둘 수도 있습니다.</p>
        <div class="row"><button class="btn" data-act="copy">보고서 텍스트 복사</button><span class="small" id="copied" role="status"></span></div><textarea class="copybox" id="copybox" readonly hidden>${esc(reportText())}</textarea></div>`
      :`<form class="card stack" id="fin" novalidate><h3 style="font-size:18px">사관의 성찰</h3>
        <label class="f" for="r1">실제 역사와 가장 다르게 선택한 사건은 무엇인가요? 우리 선택의 결과를 실제 역사와 비교해 보세요. <span class="hint">${MIN_REF}자 이상</span><textarea id="r1">${esc(L.ref.a)}</textarea></label>
        <label class="f" for="r2">실제 왕의 선택 하나를 골라, 당시 상황을 근거로 평가해 보세요. <span class="hint">${MIN_REF}자 이상</span><textarea id="r2">${esc(L.ref.b)}</textarea></label>
        <label class="f" for="r3">우리 모둠의 치세를 실록 한 문단으로 정리해 보세요. <span class="hint">${MIN_REF}자 이상</span><textarea id="r3">${esc(L.ref.c)}</textarea></label>
        <div class="err" id="err"></div><button class="btn primary big" type="submit">선생님께 제출하기</button></form>`}
    </div>
    <div class="side"><div class="card">${gaugesHTML(m.st)}</div><div class="card"><h3 style="font-size:16px; margin-bottom:10px">최종 순위</h3><div id="lb">${leaderboardHTML(room,m.id)}</div></div></div></div>
    <div class="card"><h3 style="font-size:17px; margin-bottom:10px">각 나라의 최종 모습</h3><div id="live">${othersHTML()}</div></div></div>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('submit', e=>{
  e.preventDefault();
  const f=e.target, btn=f.querySelector('button[type=submit]');
  if(f.id==='join'){
    const code=v('code').trim().toUpperCase(), team=v('team').trim(), members=v('members').trim();
    if(code.length!==4) return fail('방 코드 네 글자를 입력하세요.');
    if(!team) return fail('모둠 이름을 입력하세요.'); if(!members) return fail('모둠원을 입력하세요.');
    btn.disabled=true;
    API.post({action:'join', code, team, members}).then(j=>{
      if(!j.ok){ btn.disabled=false; return fail(j.error); }
      L={code, teamId:j.teamId, teamName:team, members}; save(); ver=0; poll();
    }).catch(()=>{ btn.disabled=false; fail('서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.'); });
  }
  if(f.id==='act'){
    const d=L.draft;
    if(!d.pick) return fail('사건에 대한 대책을 하나 고르세요.');
    if(d.why.trim().length<MIN_WHY) return fail('결정 근거를 '+MIN_WHY+'자 이상 쓰세요. 지금 '+d.why.trim().length+'자입니다.');
    btn.disabled=true; btn.textContent='올리는 중…';
    API.post({action:'submit', code:L.code, teamId:L.teamId, turn:room.turn, choice:d.pick, gov:{tax:d.tax, bud:d.bud}, why:d.why.trim()}).then(j=>{
      if(!j.ok){ btn.disabled=false; btn.textContent='어명을 올린다'; return fail(j.error); }
      editing=false; ver=0; poll();
    }).catch(()=>{ btn.disabled=false; btn.textContent='어명을 올린다'; fail('전송하지 못했습니다. 다시 눌러 주세요.'); });
  }
  if(f.id==='fin'){
    L.ref={a:v('r1'),b:v('r2'),c:v('r3')}; save();
    if([L.ref.a,L.ref.b,L.ref.c].some(x=>x.trim().length<MIN_REF)) return fail('세 질문에 각각 '+MIN_REF+'자 이상 답하세요.');
    btn.disabled=true;
    API.post({action:'final', code:L.code, teamId:L.teamId, ref1:L.ref.a, ref2:L.ref.b, ref3:L.ref.c}).then(j=>{ if(!j.ok){ btn.disabled=false; return fail(j.error); } ver=0; poll(); })
      .catch(()=>{ btn.disabled=false; fail('전송하지 못했습니다. 다시 눌러 주세요.'); });
  }
});
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-pick],[data-act]'); if(!t||t.disabled) return;
  if(t.dataset.pick){ L.draft.pick=t.dataset.pick; save(); document.querySelectorAll('.ch').forEach(b=>b.setAttribute('aria-pressed', b.dataset.pick===L.draft.pick)); return; }
  const a=t.dataset.act;
  if(a==='edit'){ editing=true; const sub=room.mySub; if(sub){ draft(); Object.assign(L.draft,{pick:sub.choice, tax:sub.gov.tax, bud:Object.assign({},sub.gov.bud), why:sub.why}); save(); } render(); return; }
  if(a==='goal'){ const g=v('goal'); t.disabled=true; API.post({action:'goal', code:L.code, teamId:L.teamId, goal:g}).then(j=>{ t.disabled=false; document.getElementById('gs').textContent=j.ok?'저장됨':'저장 실패'; }).catch(()=>{ t.disabled=false; document.getElementById('gs').textContent='저장 실패'; }); return; }
  if(a==='copy'){ const m=document.getElementById('copied'), fb=()=>{ const b=document.getElementById('copybox'); b.hidden=false; b.select(); m.textContent='상자 내용을 직접 복사하세요.'; };
    try{ navigator.clipboard.writeText(reportText()).then(()=>{ m.textContent='복사했습니다.'; }, fb); }catch(_){ fb(); } }
});
document.addEventListener('input', e=>{
  const id=e.target.id;
  if(id==='tax'){ L.draft.tax=+e.target.value; updGov(); save(); return; }
  if(e.target.dataset.bud){ L.draft.bud[e.target.dataset.bud]=+e.target.value; updGov(); save(); return; }
  if(id==='why'){ L.draft.why=e.target.value; document.getElementById('cnt').textContent=L.draft.why.trim().length+'자'; save(); return; }
  if(id==='goal'){ L.goalDraft=e.target.value; save(); }
  if(['r1','r2','r3'].includes(id)){ L.ref={a:v('r1'),b:v('r2'),c:v('r3')}; save(); }
});
render(); poll();
</script>
</body>
</html>
